services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: dataplatform
      POSTGRES_PASSWORD: dataplatform
      POSTGRES_DB: crm_db
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db

  chroma:
    image: chromadb/chroma:latest
    ports:
      - "8001:8000"
    volumes:
      - chromadata:/chroma/chroma

  redis:
    image: redis:7
    ports:
      - "6380:6379"

volumes:
  pgdata:
  mongodata:
  chromadata:
